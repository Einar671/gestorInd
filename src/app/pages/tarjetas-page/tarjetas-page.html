<header><h1>Tarjetas de los usuarios</h1></header>

@if (service.loading()) {
  <p>Cargando…</p>
}

@if (service.error()) {
  <p class="text-danger">{{ service.error() }}</p>
}

<section class="row">
<div class="col-12 col-sm-6">
    <app-tarjetas-busq></app-tarjetas-busq>

</div>

  <div class="col-12">
@if (!service.loading() && !service.error() && service.filtered().length === 0) {
  <p>Sin resultados</p>
}@else {
    <app-tarjetas-list
  [users]="service.filtered()"
  listName="Usuarios"
  (favToggled)="service.toggleFav($event)"
></app-tarjetas-list>
}
  </div>
</section>
